<!DOCTYPE html>
<html>
  <head>
    <!-- Scan and Scream: eyes, giant, rappel, web, babies, and you become the spider.
         Needs spider-v4.glb next to this file. Add ?debug to the URL for a status line. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan and Scream</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/@needle-tools/engine@4.4.0-alpha.5/dist/three.min.js",
          "@needle-tools/engine": "https://cdn.jsdelivr.net/npm/@needle-tools/engine@4.4.0-alpha.5/dist/needle-engine.min.js",
          "@needle-tools/facefilter": "https://cdn.jsdelivr.net/npm/@needle-tools/facefilter/dist/facefilter.min.js"
        }
      }
    </script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@needle-tools/facefilter/dist/facefilter.min.js"></script>
    <style>
      .ui { position: fixed; z-index: 10000; font-family: Creepster, Impact, sans-serif; }
      /* ghostly glow around the edges: doubles as a ring light on the visitor's face */
      #frame { position: fixed; inset: 0; z-index: 9999; pointer-events: none;
               box-shadow: inset 0 0 70px 34px rgba(225, 235, 255, 0.85); }
      #caption { top: 12%; left: 0; right: 0; text-align: center; color: #ff2a1a; font-size: 9vw;
                 text-shadow: 0 0 12px #000, 0 0 4px #000; opacity: 0; transition: opacity 0.6s; pointer-events: none; }
      #caption.on { opacity: 1; }
      #curse { bottom: 7%; left: 50%; transform: translateX(-50%); padding: 14px 26px; font-size: 7vw;
               color: #fff; background: #5b0a0a; border: 2px solid #ff2a1a; border-radius: 40px;
               box-shadow: 0 0 18px #ff2a1a; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
      #curse.on { opacity: 1; pointer-events: auto; }
      #preview { inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column;
                 align-items: center; justify-content: center; gap: 14px; padding: 16px; }
      #preview.on { display: flex; }
      #preview img { max-width: 92%; max-height: 68vh; border: 3px solid #ff2a1a; border-radius: 10px; }
      #preview .row { display: flex; gap: 12px; }
      #preview button { font-family: inherit; font-size: 6vw; padding: 10px 22px; border-radius: 30px;
                        border: 2px solid #ff2a1a; background: #5b0a0a; color: #fff; }
      #preview p { color: #ddd; font-family: system-ui, sans-serif; font-size: 15px; margin: 0; }
      #start { inset: 0; background: rgba(0,0,0,0.78); display: flex; flex-direction: column;
               align-items: center; justify-content: center; color: #ff2a1a; font-size: 11vw; text-align: center;
               text-shadow: 0 0 14px #000; cursor: pointer; }
      #start small { font-size: 5vw; color: #ddd; margin-top: 12px; }
      #start.off { display: none; }
      #mute { top: 14px; right: 14px; font-size: 26px; background: #0008; color: #fff; border: 1px solid #fff5;
              border-radius: 24px; padding: 4px 10px; display: none; }
      #mute.on { display: block; }
      #menu { inset: 0; background: rgba(0,0,0,0.86); display: none; flex-direction: column; align-items: center;
              justify-content: center; gap: 14px; color: #ff2a1a; font-size: 10vw; text-shadow: 0 0 14px #000; }
      #menu.on { display: flex; }
      #menu .card { font-family: inherit; font-size: 8vw; width: 78vw; padding: 12px; border-radius: 18px; border: 2px solid #ff2a1a;
                    background: #2a0505; color: #fff; box-shadow: 0 0 14px #ff2a1a88; }
      #menu .card small { display: block; font-family: system-ui, sans-serif; font-size: 3.6vw; color: #ccc; margin-top: 4px; }
      #menu .card:disabled { opacity: 0.45; }
      #again { top: 14px; left: 14px; font: 16px system-ui, sans-serif; background: #0008; color: #fff; border: 1px solid #fff5;
               border-radius: 24px; padding: 7px 12px; display: none; }
      #again.on { display: block; }
      #dbg { left: 8px; bottom: 8px; color: #0f0; font: 13px monospace; background: #000a; padding: 4px 8px; }
    </style>
  </head>
  <body style="margin:0; padding:0; background:#000;">
    <needle-engine
      face-filter="./spider-v4.glb"
      face-filter-scale="0.85"
      face-filter-offset="0, 0.1, 0.01">
    </needle-engine>

    <div id="frame"></div>
    <div id="caption" class="ui">don't look behind you...</div>
    <button id="curse" class="ui">Take the curse home</button>
    <button id="mute" class="ui">🔊</button>
    <button id="again" class="ui">☰ Choose another</button>
    <div id="menu" class="ui">Choose your nightmare
      <button class="card" data-mode="spiders">🕷️ Spiders<small>something is behind you...</small></button>
      <button class="card" data-mode="mummy">🧟 Mummy<small>wrapped in the curse of the tomb</small></button>
      <button class="card" data-mode="worms" disabled>🪱 Worms<small>coming soon... open wide</small></button>
    </div>
    <div id="start" class="ui">Tap to enter...<br>if you dare<small>turn your sound on</small></div>
    <div id="preview" class="ui">
      <img id="shot" alt="Your cursed photo">
      <div class="row"><button id="share">Share</button><button id="close">Close</button></div>
      <p id="hint">Press and hold the photo to save it.</p>
    </div>

    <script type="module">
      import { onStart } from "@needle-tools/engine";
      import { Quaternion, Vector3, Group, Mesh, BufferGeometry, Float32BufferAttribute,
               MeshBasicMaterial, CylinderGeometry, DoubleSide, CanvasTexture, SRGBColorSpace, NoColorSpace,
               RepeatWrapping, SphereGeometry } from "three";
      import { FaceMeshTexture, FaceFilterRoot } from "@needle-tools/facefilter";

      // ================= SETTINGS YOU CAN PLAY WITH =================
      // Positions are x, y, z in head space: y = up, z = toward the camera.
      const S = {
        SMALL_SCALE: 0.65,                                 // the little spider on your head
        ENTRANCE_SECONDS: 1.6,  ENTRANCE_DISTANCE: 0.35,
        BREATH_SECONDS: 2.4,    CHEW_EVERY: 3.5,
        CYCLE_START: 3.0,       CYCLE_SECONDS: 24.5,
        GIANT_SCALE: 3.2,  GIANT_PEEK: [0, -0.08, -0.16],  GIANT_RISE: 0.16,  GIANT_TILT: 0.3,
        GIANT_SOLID: true,                                 // body can't be cut by the invisible head once it has risen
        EYES_RISE: 0.12,
        WEB_POS: [0, -0.17, 0.09],  WEB_RADIUS: 0.09,       // last number = face depth (toward camera)
        FACE_CURVE: 4,                                     // how sharply the face curves away (web + babies wrap it)
        MOM_OFFSET: [0, 0, 0],                             // nudge mom's resting spot: [x, up, toward camera]
        BABIES: 5,  BABY_SIZE: [0.2, 0.3],                 // random size range per baby
        BABY_ZONE: { x: 0, y: -0.12, rx: 0.09, ry: 0.13 }, // oval on your face/head they must stay inside
        BABY_SPEED: [0.05, 0.11],                          // meters/second while darting
        YOU_SCALE: 2.64,  YOU_POS: [0, -0.36, -0.03],       // finale: your head on a spider body (legs under your chin)
        CURSE_BUTTON_AT: 7.5,
        CAPTIONS: [[0, 4.5, "don't look behind you..."], [10.5, 13, "they're hatching..."], [18.5, 23.5, "you're one of us now..."]],
        VOLUME: 0.9,
        // ---- Mummy mode ----
        MUMMY_WRAP_SECONDS: 2.5,                           // bandages wind on, chin to forehead
        MUMMY_SPIDERS: 8,                                  // spiders crawling out from under the wraps
        MUMMY_CYCLE: 20,
        MUMMY_CAPTIONS: [[2.5, 6.5, "the curse of the tomb..."], [11, 15, "something's under the wraps..."]],
        HOOD_CENTER: [0, -0.10, -0.03],                    // bandage hood over hair and ears (an egg around your head)
        HOOD_RADII: [0.11, 0.15, 0.13],                    // [width, height, depth] half-sizes in meters
        HOOD_SCALE: 1.0,                                   // quick overall size knob (tune panel)
        HOOD_FOREHEAD_LAT: 0.3,                            // below this band the front stays open for your face
        HOOD_FACE_GAP: 1.2,                                // radians of open face on each side of center
      };
      const MODE_PARAM = new URLSearchParams(location.search).get("mode");   // ?mode=mummy skips the menu
      //   0-3 eyes | 3-4.2 giant rises | 4.5-7.5 rappel | 7.5-10.5 web | 10.5-17.5 babies roam
      //   12.5-13.7 giant sinks | 13-15.5 mom climbs up | 16.5-17.5 babies hide in your hair
      //   18-18.8 legs burst from under your chin | 18.8-23.5 you ARE the spider | 23.5-24.3 legs retract
      // ===============================================================

      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const debug = params.has("debug"), tuneMode = params.has("tune");
      const AT = params.has("at") ? parseFloat(params.get("at")) : null;   // e.g. ?at=8 jumps to the web
      const TIME = { frozenAt: null, jumpTo: null };
      let dbg = null;
      if (debug) { dbg = document.createElement("div"); dbg.id = "dbg"; dbg.className = "ui"; document.body.appendChild(dbg); }
      const log = t => { if (dbg) dbg.textContent = t; };
      const rand = (a, b) => a + Math.random() * (b - a);

      // =================== SOUND (all synthesized, no files) ===================
      let ac = null, master = null, noiseBuf = null, muted = false;
      function initAudio() {
        if (ac) { ac.resume(); return; }
        try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = S.VOLUME; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        drone();
      }
      function env(g, t0, peak, a, hold, r) {
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + a);
        g.gain.setValueAtTime(peak, t0 + a + hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + hold + r);
      }
      function drone() {   // low, slowly breathing, slightly out of tune
        const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 160; f.Q.value = 6;
        const g = ac.createGain(); g.gain.value = 0.07; f.connect(g); g.connect(master);
        [55, 58.3, 82.4].forEach(hz => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz; o.connect(f); o.start(); });
        const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.08; lg.gain.value = 90;
        lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      }
      function noise(t0, type, hz, q, peak, a, hold, r) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = hz; f.Q.value = q;
        const g = ac.createGain(); env(g, t0, peak, a, hold, r);
        src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + a + hold + r + 0.05);
        return f;
      }
      const SFX = {
        whisper() {  // breathy hiss that sweeps, like something inhaling behind you
          const t = ac.currentTime, f = noise(t, "bandpass", 900, 7, 0.35, 0.6, 0.5, 1.2);
          f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(2200, t + 1.6);
        },
        stinger() {  // dissonant swell + noise hit
          const t = ac.currentTime;
          [110, 116.5, 155.6, 233].forEach(hz => {
            const o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth"; o.frequency.value = hz;
            o.frequency.linearRampToValueAtTime(hz * 0.97, t + 2.5);
            env(g, t, 0.09, 0.08, 0.3, 2.2); o.connect(g); g.connect(master); o.start(t); o.stop(t + 2.7);
          });
          noise(t, "lowpass", 900, 1, 0.5, 0.01, 0.05, 0.7);
        },
        heartbeat(count) {
          const t0 = ac.currentTime;
          for (let i = 0; i < count; i++) for (const [dt, v] of [[0, 0.6], [0.22, 0.4]]) {
            const t = t0 + i * 0.95 + dt, o = ac.createOscillator(), g = ac.createGain();
            o.type = "sine"; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
            env(g, t, v, 0.01, 0.02, 0.18); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
          }
        },
        skitter(seconds, density) {  // tiny leg clicks at random intervals
          let t = ac.currentTime; const end = t + seconds;
          while (t < end) { noise(t, "highpass", rand(2500, 5500), 1, rand(0.08, 0.22), 0.002, 0.004, 0.02); t += rand(0.02, 0.09) / density; }
        },
      };
      function makeMummyPainter(W, H, seed) {
        let s = seed >>> 0;
        const rnd = (a = 0, b = 1) => { s = (s * 1664525 + 1013904223) >>> 0; return a + (s / 4294967296) * (b - a); };
        // Face texture landmarks (procreate layout, canvas fractions)
        const EYES = [[0.312, 0.352], [0.688, 0.352]], MOUTH = [0.5, 0.625];
        const strips = [];
        const N = 30;
        for (let i = 0; i < N; i++) {
          strips.push({
            y: 0.06 + (i + rnd(-0.35, 0.35)) * (0.86 / N),
            angle: (rnd() < 0.2 ? rnd(-0.5, 0.5) : rnd(-0.16, 0.16)),   // mostly wrapped around, a few diagonals
            w: rnd(0.045, 0.075) * H,
            tone: rnd(-35, 5),
            sag: rnd(-0.03, 0.03),
            stains: Array.from({ length: Math.floor(rnd(2, 7)) }, () => [rnd(-0.5, 0.5), rnd(-0.4, 0.4), rnd(0.03, 0.09), rnd(0.25, 0.6)]),
            fibers: Array.from({ length: 6 }, () => [rnd(-0.45, 0.45), rnd(0.2, 0.9), rnd(0.03, 0.12)]),
            blood: rnd() < 0.35 ? [rnd(-0.35, 0.35), rnd(0.08, 0.22), rnd(0.35, 0.7)] : null,
          });
        }
        strips.sort((a, b) => b.y - a.y);          // wrap from chin upward
        const jag = (cx, cy, rx, ry, k) => {        // irregular torn edge: smooth wobble + small tears
          const p1 = rnd(0, 6.3), p2 = rnd(0, 6.3), p3 = rnd(0, 6.3), pts = [];
          for (let i = 0; i < 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            const r = 1 + k * (0.5 * Math.sin(2 * a + p1) + 0.3 * Math.sin(3 * a + p2) + 0.2 * Math.sin(7 * a + p3)) + rnd(-0.04, 0.04);
            pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
          }
          return pts;
        };
        const holes = [
          jag(EYES[0][0] * W, EYES[0][1] * H, 0.075 * W, 0.05 * H, 0.18),
          jag(EYES[1][0] * W, EYES[1][1] * H, 0.075 * W, 0.05 * H, 0.18),
          jag(MOUTH[0] * W, MOUTH[1] * H, 0.12 * W, 0.058 * H, 0.2),
        ];
        const drips = [];
        [[EYES[0][0], EYES[0][1] + 0.045], [EYES[1][0], EYES[1][1] + 0.045], [MOUTH[0] - 0.08, MOUTH[1] + 0.04], [MOUTH[0] + 0.07, MOUTH[1] + 0.045]]
          .forEach(([x, y]) => { for (let k = 0; k < 2; k++) drips.push([x + rnd(-0.03, 0.03), y, rnd(0.05, 0.16), rnd(5, 11)]); });
        const splats = Array.from({ length: 26 }, () => [MOUTH[0] + rnd(-0.18, 0.18), MOUTH[1] + rnd(-0.08, 0.14), rnd(2, 7)]);
        const path = (ctx, pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };

        return function paint(ctx, count) {
          ctx.clearRect(0, 0, W, H);
          ctx.globalCompositeOperation = "source-over";
          if (count > 0) {                             // older, greyer wraps underneath: no skin shows through
            const reveal = Math.min(1, count / strips.length);
            ctx.fillStyle = "rgb(128, 122, 106)";
            ctx.fillRect(0, H * (1 - reveal), W, H * reveal);
            ctx.strokeStyle = "rgba(70, 62, 48, 0.35)"; ctx.lineWidth = 6;
            for (let y = H * (1 - reveal); y < H; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + 18); ctx.stroke(); }
          }
          for (let i = 0; i < Math.min(count, strips.length); i++) {
            const st = strips[i];
            ctx.save();
            ctx.translate(W / 2, st.y * H);
            ctx.rotate(st.angle);
            const L = W * 0.75, w = st.w;
            // shadow cast on the layer below
            ctx.fillStyle = "rgba(30, 20, 8, 0.35)";
            ctx.fillRect(-L, -w / 2 + w * 0.18, 2 * L, w);
            // cloth body: darker edges, lighter middle = rounded look
            const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
            const c = (v) => `rgb(${Math.round(v[0] + st.tone)}, ${Math.round(v[1] + st.tone)}, ${Math.round(v[2] + st.tone)})`;
            g.addColorStop(0, c([165, 158, 140])); g.addColorStop(0.25, c([222, 217, 200]));
            g.addColorStop(0.6, c([234, 230, 216])); g.addColorStop(1, c([150, 142, 122]));
            ctx.fillStyle = g;
            ctx.beginPath();                       // slightly sagging cloth instead of a perfect plank
            ctx.moveTo(-L, -w / 2); ctx.quadraticCurveTo(0, -w / 2 + st.sag * H, L, -w / 2);
            ctx.lineTo(L, w / 2); ctx.quadraticCurveTo(0, w / 2 + st.sag * H, -L, w / 2); ctx.closePath(); ctx.fill();
            // woven fibers
            for (const [fy, alpha, lw] of st.fibers) {
              ctx.strokeStyle = `rgba(110, 92, 60, ${alpha * 0.18})`; ctx.lineWidth = lw * w * 0.12;
              ctx.beginPath(); ctx.moveTo(-L, fy * w); ctx.lineTo(L, fy * w + (alpha - 0.5) * 6); ctx.stroke();
            }
            // grime stains
            for (const [sx, sy, r, a] of st.stains) {
              const rg = ctx.createRadialGradient(sx * W, sy * w, 0, sx * W, sy * w, r * W);
              rg.addColorStop(0, `rgba(120, 96, 52, ${a * 0.8})`); rg.addColorStop(0.6, `rgba(130, 105, 60, ${a * 0.3})`); rg.addColorStop(1, "rgba(130, 105, 60, 0)");
              ctx.fillStyle = rg; ctx.fillRect(sx * W - r * W, -w / 2, 2 * r * W, w);
            }
            // old blood soaked into this strip
            if (st.blood) {
              const [bx, br, ba] = st.blood;
              ctx.save(); ctx.scale(1, 0.35);
              const bg = ctx.createRadialGradient(bx * W, 0, 0, bx * W, 0, br * W);
              bg.addColorStop(0, `rgba(105, 8, 8, ${ba})`); bg.addColorStop(0.5, `rgba(120, 15, 12, ${ba * 0.6})`); bg.addColorStop(1, "rgba(120, 15, 12, 0)");
              ctx.fillStyle = bg; ctx.fillRect(bx * W - br * W, -br * W, 2 * br * W, 2 * br * W);
              ctx.restore();
            }
            // frayed edges
            ctx.strokeStyle = "rgba(235, 230, 214, 0.8)"; ctx.lineWidth = 1.5;
            for (let k = 0; k < 40; k++) {
              const x = -L + (k / 40) * 2 * L + (k * 37 % 11), side = k % 2 ? -1 : 1;
              ctx.beginPath(); ctx.moveTo(x, side * w / 2); ctx.lineTo(x + ((k * 13) % 7) - 3, side * (w / 2 + 3 + (k * 7) % 6)); ctx.stroke();
            }
            ctx.restore();
          }
          // tear out the eye and mouth holes
          ctx.globalCompositeOperation = "destination-out";
          holes.forEach(h => { path(ctx, h); ctx.fill(); });
          // dark, damp rims around the holes (only where cloth exists)
          ctx.globalCompositeOperation = "source-atop";
          ctx.lineWidth = 0.03 * W; ctx.strokeStyle = "rgba(45, 28, 10, 0.55)";
          holes.forEach(h => { path(ctx, h); ctx.stroke(); });
          if (count >= strips.length) {                // blood runs from the eyes and mouth once fully wrapped
            ctx.lineCap = "round";
            for (const [x, y, len, wpx] of drips) {
              const g2 = ctx.createLinearGradient(0, y * H, 0, (y + len) * H);
              g2.addColorStop(0, "rgba(120, 6, 6, 0.9)"); g2.addColorStop(1, "rgba(90, 4, 4, 0.75)");
              ctx.strokeStyle = g2; ctx.lineWidth = wpx;
              ctx.beginPath(); ctx.moveTo(x * W, y * H);
              ctx.bezierCurveTo(x * W + wpx, (y + len * 0.4) * H, x * W - wpx, (y + len * 0.7) * H, x * W, (y + len) * H); ctx.stroke();
              ctx.fillStyle = "rgba(95, 4, 4, 0.9)"; ctx.beginPath(); ctx.arc(x * W, (y + len) * H, wpx * 0.9, 0, 7); ctx.fill();
            }
            for (const [x, y, r] of splats) { ctx.fillStyle = "rgba(115, 8, 8, 0.7)"; ctx.beginPath(); ctx.arc(x * W, y * H, r, 0, 7); ctx.fill(); }
          }
          ctx.globalCompositeOperation = "source-over";
        };
      }
      function makeStripPainter(W, H, seed) {
        let s = seed >>> 0;
        const rnd = (a = 0, b = 1) => { s = (s * 1664525 + 1013904223) >>> 0; return a + (s / 4294967296) * (b - a); };
        return function paint(ctx) {
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "rgb(150, 143, 126)"); g.addColorStop(0.25, "rgb(218, 213, 197)");
          g.addColorStop(0.6, "rgb(230, 226, 212)"); g.addColorStop(1, "rgb(138, 130, 112)");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
          for (let i = 0; i < 18; i++) {             // fibers
            ctx.strokeStyle = `rgba(110, 100, 80, ${rnd(0.05, 0.15)})`; ctx.lineWidth = rnd(1, 3);
            const y = rnd(0, H); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + rnd(-4, 4)); ctx.stroke();
          }
          for (let i = 0; i < 9; i++) {              // grime
            const x = rnd(0, W), y = rnd(0, H), r = rnd(20, 70);
            const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
            rg.addColorStop(0, `rgba(120, 96, 52, ${rnd(0.2, 0.45)})`); rg.addColorStop(1, "rgba(120, 96, 52, 0)");
            ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
          }
          for (let i = 0; i < 3; i++) {              // blood smears
            const x = rnd(0, W), r = rnd(30, 80);
            ctx.save(); ctx.translate(x, H * rnd(0.3, 0.7)); ctx.scale(1, 0.4);
            const bg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
            bg.addColorStop(0, `rgba(105, 8, 8, ${rnd(0.45, 0.75)})`); bg.addColorStop(1, "rgba(120, 15, 12, 0)");
            ctx.fillStyle = bg; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
          }
        };
      }

      SFX.moan = function () {   // low, wavering groan from inside the wraps
        const t = ac.currentTime, f = ac.createBiquadFilter(), g = ac.createGain();
        f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(620, t); f.frequency.exponentialRampToValueAtTime(260, t + 2.2);
        env(g, t, 0.28, 0.4, 0.8, 1.3); f.connect(g); g.connect(master);
        const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5; vg.gain.value = 3; vib.connect(vg); vib.start(t); vib.stop(t + 2.6);
        [1, 1.012].forEach(k => {
          const o = ac.createOscillator(); o.type = "sawtooth";
          o.frequency.setValueAtTime(110 * k, t); o.frequency.exponentialRampToValueAtTime(78 * k, t + 2.4);
          vg.connect(o.frequency); o.connect(f); o.start(t); o.stop(t + 2.6);
        });
      };
      SFX.swish = function () {   // cloth being pulled tight
        noise(ac.currentTime, "bandpass", rand(1200, 2200), 0.9, 0.12, 0.03, 0.02, 0.12);
      };

      const play = (name, ...args) => { if (ac && !muted) try { SFX[name](...args); } catch (e) {} };

      // =================== MOTION HELPERS ===================
      const X = new Vector3(1, 0, 0), Y = new Vector3(0, 1, 0), Z = new Vector3(0, 0, 1);
      const qA = new Quaternion(), qB = new Quaternion();
      const qTilt = new Quaternion().setFromAxisAngle(X, S.GIANT_TILT);
      const qHang = new Quaternion().setFromAxisAngle(X, Math.PI / 2);
      const turn = (part, axis, angle) => part.o.quaternion.copy(part.q).multiply(qA.setFromAxisAngle(axis, angle));
      const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
      const within = (c, a, b) => c >= a && c < b;
      const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
      const v3 = a => new Vector3(...a);
      // gently curved face surface so babies hug the face instead of floating in a flat plane
      const curveZ = (dx, dy) => S.FACE_CURVE * dx * dx + S.FACE_CURVE * 0.4 * dy * dy;
      const faceZ = (x, y) => S.WEB_POS[2] - curveZ(x - S.WEB_POS[0], y - S.WEB_POS[1]);

      const LEGS = ["LegL0", "LegL1", "LegL2", "LegL3", "LegR0", "LegR1", "LegR2", "LegR3"];
      const GAIT_A = new Set(["LegL0", "LegR1", "LegL2", "LegR3"]);

      function collect(root, rest) {
        const get = n => {
          const o = n === "SpiderRig" ? root : root.getObjectByName(n);
          if (!o) return null;
          const src = rest ? rest[n] : { q: o.quaternion, p: o.position, s: o.scale };
          return { o, q: src.q.clone(), p: src.p.clone(), s: src.s.clone() };
        };
        const r = { SpiderRig: get("SpiderRig"), Torso: get("Torso"), Abdomen: get("Abdomen"),
                    FangL: get("FangL"), FangR: get("FangR") };
        LEGS.forEach(n => r[n] = get(n));
        return r.Torso && r.Abdomen && LEGS.every(n => r[n]) ? r : null;
      }
      // Draw a rig's body (not its legs) before the face filter's invisible head so the head can't cut holes in it.
      function setBodySolid(r, solid) {
        if (!r || r._solid === solid) return;
        r._solid = solid;
        r.Torso.o.traverse(o => { if (o.isMesh) o.renderOrder = solid ? -500 : 0; });
      }
      const newState = off => ({ nextTwitch: 0, leg: null, start: -99, chewOffset: off, gaitSpeed: 9 });

      function animateBody(r, st, t, mode) {
        const b = Math.sin(2 * Math.PI * t / S.BREATH_SECONDS);
        r.Abdomen.o.scale.set(r.Abdomen.s.x * (1 + 0.02 * b), r.Abdomen.s.y * (1 + 0.04 * b), r.Abdomen.s.z * (1 + 0.04 * b));
        r.Torso.o.position.y = r.Torso.p.y + 0.0012 * Math.sin(2 * Math.PI * t / S.BREATH_SECONDS + 1);
        const c = (t + st.chewOffset) % S.CHEW_EVERY;
        const chew = c < 0.7 ? 0.35 * Math.sin(2 * Math.PI * 7 * c) * Math.sin(Math.PI * c / 0.7) : 0;
        if (r.FangL) turn(r.FangL, X, chew);
        if (r.FangR) turn(r.FangR, X, -chew);
        if (mode === "idle" && t > st.nextTwitch) {
          st.leg = LEGS[Math.floor(Math.random() * 8)]; st.start = t; st.nextTwitch = t + 0.8 + Math.random() * 1.6;
        }
        LEGS.forEach((n, i) => {
          let lift;
          if (mode === "walk") lift = 0.45 * Math.max(0, Math.sin(2 * Math.PI * st.gaitSpeed * t + (GAIT_A.has(n) ? 0 : Math.PI)));
          else if (mode === "flail") lift = 0.3 * Math.sin(2 * Math.PI * 3 * t + i);
          else {
            lift = 0.03 * Math.sin(1.3 * t + i);
            const tw = t - st.start;
            if (n === st.leg && tw < 0.28) lift += 0.5 * Math.sin(Math.PI * tw / 0.28);
          }
          turn(r[n], Z, lift);
        });
      }

      function eyeState(c) {
        if (!within(c, 0, 3)) return null;
        let open = 1, rise = 1;
        if (c < 0.8) rise = smooth(c / 0.8);
        if (c < 0.3) open = c / 0.3;
        if (c > 1.8 && c < 2.0) open = Math.abs(c - 1.9) / 0.1;
        if (c > 2.7) rise = 1 - smooth((c - 2.7) / 0.3);
        return { open, rise };
      }

      function makeWeb(radius) {
        const spokes = 10, rings = 7, w = 0.0012, pos = [];
        const quad = (a, b) => {
          const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
          const nx = -dy / L * w / 2, ny = dx / L * w / 2;
          const v = (x, y) => [x, y, -curveZ(x, y)];     // bend each corner back to follow the face
          pos.push(...v(a.x + nx, a.y + ny), ...v(a.x - nx, a.y - ny), ...v(b.x + nx, b.y + ny),
                   ...v(b.x + nx, b.y + ny), ...v(a.x - nx, a.y - ny), ...v(b.x - nx, b.y - ny));
        };
        const P = (r, k) => { const a = 2 * Math.PI * k / spokes; return { x: r * Math.cos(a), y: r * Math.sin(a) }; };
        for (let k = 0; k < spokes; k++) quad(P(radius * 0.05, k), P(radius * (0.92 + 0.08 * Math.sin(k * 3.1)), k));
        for (let ring = 1; ring <= rings; ring++) for (let k = 0; k < spokes; k++) {
          const r0 = radius * (0.12 + 0.8 * (ring - 1 + k / spokes) / rings);
          const r1 = radius * (0.12 + 0.8 * (ring - 1 + (k + 1) / spokes) / rings);
          quad(P(r0, k), P(r1, k + 1));
        }
        const geo = new BufferGeometry(); geo.setAttribute("position", new Float32BufferAttribute(pos, 3));
        const mesh = new Mesh(geo, new MeshBasicMaterial({ color: 0xf2f2ff, transparent: true, opacity: 0.9, side: DoubleSide, depthWrite: false }));
        mesh.userData.segments = pos.length / 18; mesh.frustumCulled = false;
        return mesh;
      }

      // Bandage hood: ribbons wound around a unit sphere, stretched into an egg by the group's scale.
      function makeHood(tex) {
        const group = new Group(), ribbons = [];
        const mat = new MeshBasicMaterial({ map: tex, side: DoubleSide });
        let seed = 7; const rr = (a, b) => { seed = (seed * 1664525 + 1013904223) >>> 0; return a + (seed / 4294967296) * (b - a); };
        let i = 0;
        for (let lat0 = -0.6; lat0 < 1.36; lat0 += 0.125, i++) {
          const open = lat0 < S.HOOD_FOREHEAD_LAT;
          const th0 = open ? S.HOOD_FACE_GAP : -Math.PI, th1 = open ? 2 * Math.PI - S.HOOD_FACE_GAP : Math.PI;
          const tilt = rr(-0.1, 0.1), phase = rr(0, 6.28), width = rr(0.13, 0.18), lift = 1 + 0.01 * (i % 3) + 0.003 * i, uOff = rr(0, 1);
          const seg = 64, pos = [], uv = [], idx = [];
          for (let k = 0; k <= seg; k++) {
            const th = th0 + (th1 - th0) * k / seg, lat = lat0 + tilt * Math.sin(th + phase);
            for (const [side, v] of [[-0.5, 0], [0.5, 1]]) {
              const la = Math.min(1.52, lat + side * width), cl = Math.cos(la);
              pos.push(Math.sin(th) * cl * lift, Math.sin(la) * lift, Math.cos(th) * cl * lift);
              uv.push(uOff + (th1 - th0) * (k / seg) * 0.6, v);
            }
            if (k < seg) { const q = k * 2; idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2); }
          }
          const geo = new BufferGeometry();
          geo.setAttribute("position", new Float32BufferAttribute(pos, 3));
          geo.setAttribute("uv", new Float32BufferAttribute(uv, 2)); geo.setIndex(idx);
          const m = new Mesh(geo, mat); m.frustumCulled = false; group.add(m); ribbons.push(m);
        }
        const cap = new Mesh(new SphereGeometry(1.04, 20, 6, 0, Math.PI * 2, 0, 0.3), mat);   // crown of the head
        cap.frustumCulled = false; group.add(cap); ribbons.push(cap);
        group.visible = false;
        return { group, ribbons };
      }

      // One baby's brain: dart, freeze, dart; wander; turn back at the edge of the face; hide at the end.
      function stepBaby(bb, dt, c) {
        const Zn = S.BABY_ZONE;
        bb.timer -= dt;
        if (bb.timer <= 0) {
          bb.darting = !bb.darting;
          bb.timer = bb.darting ? rand(0.3, 1.1) : rand(0.2, 0.9);
          bb.targetSpeed = bb.darting ? rand(...S.BABY_SPEED) : 0;
          if (bb.darting) bb.heading += rand(-1.2, 1.2);          // new idea about where to go
        }
        bb.speed += (bb.targetSpeed - bb.speed) * Math.min(1, dt * 12);
        bb.heading += rand(-1, 1) * 3 * dt;                        // constant jitter while moving
        let tx = null, ty = null;
        if (c >= 16.5) { tx = bb.hideX; ty = 0.03; bb.targetSpeed = S.BABY_SPEED[1]; bb.timer = 1; bb.darting = true; }
        else {
          const ex = (bb.x - Zn.x) / Zn.rx, ey = (bb.y - Zn.y) / Zn.ry;
          if (ex * ex + ey * ey > 0.8) { tx = Zn.x + rand(-0.03, 0.03); ty = Zn.y + rand(-0.03, 0.03); }
        }
        if (tx !== null) {                                         // steer toward target
          const want = Math.atan2(ty - bb.y, tx - bb.x);
          let d = want - bb.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
          bb.heading += d * Math.min(1, dt * 6);
        }
        bb.x += Math.cos(bb.heading) * bb.speed * dt;
        bb.y += Math.sin(bb.heading) * bb.speed * dt;
        let z = faceZ(bb.x, bb.y) + 0.004;
        if (c >= 16.5) z -= smooth((c - 16.5) / 1.0) * 0.12;       // slip back behind your head
        return z;
      }

      onStart(context => {
        let small = null, giant = null, you = null, eyes = null, babies = [], web = null, thread = null;
        let wasShown = false, start = -99, lastT = performance.now() / 1000, prevC = -1, prevSince = -1;
        const stSmall = newState(0), stGiant = newState(1.3), stYou = newState(2.1);
        let eyesHome = null;
        let MODE = null;                                   // null = menu, "spiders", "mummy"
        let mummy = null, mummyTex = null, mctx = null, paintMummy = null;
        let mStart = 0, mWasOn = false, mPainted = -1, mPrevM = -1, lastSkitter = 0, hood = null;

        function build() {
          const root = context.scene.getObjectByName("SpiderRig");
          if (!root) return false;
          small = collect(root, null);
          if (!small) return false;
          const rest = {}; for (const k in small) if (small[k]) rest[k] = small[k];
          const parent = root.parent;

          const g = root.clone(true); g.name = "GiantRig"; parent.add(g);
          giant = collect(g, rest); g.scale.setScalar(S.GIANT_SCALE); g.visible = false;

          // Spider-you: a clone with its head parts hidden, so YOUR head becomes the spider's head
          const y = root.clone(true); y.name = "YouRig"; parent.add(y); y.visible = false;
          you = collect(y, rest);
          ["Torso_body", "Torso_bristle", "Torso_eye", "FangL", "FangR"].forEach(n => {
            const o = y.getObjectByName(n); if (o) o.visible = false;
          });

          const eyeMesh = root.getObjectByName("Torso_eye");
          if (eyeMesh) {
            eyes = new Group(); eyes.add(eyeMesh.clone(true)); eyes.visible = false; parent.add(eyes);
            eyesHome = small.Torso.p.clone().applyQuaternion(qTilt).multiplyScalar(S.GIANT_SCALE).add(v3(S.GIANT_PEEK));
          }

          for (let i = 0; i < Math.max(S.BABIES, S.MUMMY_SPIDERS); i++) {
            const b = root.clone(true); b.name = "Baby" + i; parent.add(b); b.visible = false;
            const size = rand(...S.BABY_SIZE); b.scale.setScalar(size);
            const st = newState(rand(0, 3)); st.gaitSpeed = rand(10, 14);
            babies.push({ r: collect(b, rest), st, size, alive: false, delay: rand(0, 0.8), hideX: rand(-0.06, 0.06) });
          }

          // Mummy wrap: a painted texture that rides on the tracked face mesh
          try {
            const cv = document.createElement("canvas"); cv.width = cv.height = 1024;
            mctx = cv.getContext("2d"); paintMummy = makeMummyPainter(1024, 1024, 1234);
            mummyTex = new CanvasTexture(cv); mummyTex.flipY = false; mummyTex.colorSpace = NoColorSpace;   // face shader shows raw colors
            mummy = new FaceMeshTexture({ layout: "procreate", texture: { texture: mummyTex } });
            parent.addComponent(mummy);
            const ffr = parent.getComponent(FaceFilterRoot);          // make sure the filter feeds it face data
            if (ffr && Array.isArray(ffr._behaviours) && !ffr._behaviours.includes(mummy)) ffr._behaviours.push(mummy);
          } catch (err) { mummy = null; log("mummy setup failed: " + err.message); }
          try {
            const sc = document.createElement("canvas"); sc.width = 1024; sc.height = 128;
            makeStripPainter(1024, 128, 99)(sc.getContext("2d"));
            const st = new CanvasTexture(sc); st.colorSpace = SRGBColorSpace; st.wrapS = RepeatWrapping;
            hood = makeHood(st); parent.add(hood.group);
          } catch (err) { hood = null; log("hood setup failed: " + err.message); }

          web = makeWeb(S.WEB_RADIUS); web.position.set(...S.WEB_POS); web.visible = false; parent.add(web);
          const tg = new CylinderGeometry(0.0007, 0.0007, 1, 5); tg.translate(0, 0.5, 0);
          thread = new Mesh(tg, new MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
          thread.visible = false; thread.frustumCulled = false; parent.add(thread);
          return true;
        }

        function tick() {
          requestAnimationFrame(tick);
          const t = performance.now() / 1000, dt = Math.min(0.05, t - lastT); lastT = t;
          if (!small && !build()) { log("waiting for spider..."); return; }

          const faceOn = shown(small.SpiderRig.o.parent);
          const isShown = faceOn && MODE === "spiders";
          small.SpiderRig.o.visible = isShown;
          if (isShown && !wasShown) start = AT !== null ? t - (S.CYCLE_START + AT) : t;
          wasShown = isShown;
          if (TIME.jumpTo !== null) { start = t - (S.CYCLE_START + TIME.jumpTo); prevC = TIME.jumpTo; prevSince = 99; TIME.jumpTo = null; }
          if (TIME.frozenAt !== null) { start = t - (S.CYCLE_START + TIME.frozenAt); prevC = TIME.frozenAt; }
          const since = t - start;
          const c = since < S.CYCLE_START ? -1 : (since - S.CYCLE_START) % S.CYCLE_SECONDS;
          if (c < prevC) prevC = -1;                                   // new cycle
          const hit = at => isShown && prevC < at && c >= at;          // fires once when c crosses `at`

          // ---------- sound cues ----------
          if (isShown && prevSince < 0 && since >= 0) play("skitter", 1.4, 1);
          if (hit(0))    play("whisper");
          if (hit(3))    play("stinger");
          if (hit(4.6))  play("heartbeat", 8);
          if (hit(10.5)) play("skitter", 3, 1.6);
          if (hit(16.5)) play("skitter", 1, 1.2);
          if (hit(18))   { play("stinger"); play("skitter", 1.2, 2); }
          if (hit(23.5)) play("skitter", 0.8, 1.5);
          prevSince = since;

          // ---------- little spider ----------
          const R = small.SpiderRig, home = R.p.clone().add(v3(S.MOM_OFFSET)), webP = v3(S.WEB_POS);
          const u = since / S.ENTRANCE_SECONDS, walking = u < 1;
          let pos = home.clone(), hang = 0, mode = walking ? "walk" : "idle", yaw = 0;
          if (walking) {
            pos.x += S.ENTRANCE_DISTANCE * (1 - smooth(u)); yaw = -Math.PI / 2 * (1 - smooth((u - 0.7) / 0.3));
          } else if (within(c, 4.5, 7.5)) {
            pos.lerpVectors(home, webP, smooth((c - 4.5) / 3)); hang = smooth((c - 4.5) / 0.6); mode = "flail";
          } else if (within(c, 7.5, 13)) {
            pos.copy(webP); hang = 1; mode = within(c, 7.5, 10.5) ? "walk" : "idle";
          } else if (within(c, 13, 15.5)) {
            pos.lerpVectors(webP, home, smooth((c - 13) / 2.5)); hang = 1 - smooth((c - 15) / 0.5); mode = "flail";
          }
          R.o.position.copy(pos);
          R.o.scale.copy(R.s).multiplyScalar(S.SMALL_SCALE);
          R.o.quaternion.copy(R.q).multiply(qB.setFromAxisAngle(Y, yaw)).multiply(qA.setFromAxisAngle(X, Math.PI / 2 * hang));
          animateBody(small, stSmall, t, mode);

          const threadOn = isShown && within(c, 4.5, 15.5);
          thread.visible = threadOn;
          if (threadOn) {
            const top = home.clone().add(new Vector3(0, 0.005, 0.04)), dir = pos.clone().sub(top);
            thread.position.copy(top); thread.scale.set(1, Math.max(dir.length(), 0.001), 1);
            thread.quaternion.setFromUnitVectors(Y, dir.normalize());
          }

          // ---------- web ----------
          const webOn = isShown && within(c, 7.5, 14.5);
          web.visible = webOn;
          if (webOn) {
            web.position.set(...S.WEB_POS);
            web.geometry.setDrawRange(0, Math.ceil(smooth((c - 7.5) / 3) * web.userData.segments) * 6);
            web.material.opacity = 0.9 * (1 - smooth((c - 13) / 1.5));
          }

          // ---------- babies ----------
          babies.forEach((bb, i) => {
            if (!bb.r) return;
            const B = bb.r.SpiderRig, active = i < S.BABIES && isShown && c >= 10.5 + bb.delay && c < 17.5;
            if (active && !bb.alive) {                                   // hatch
              bb.alive = true; bb.x = S.WEB_POS[0] + rand(-0.01, 0.01); bb.y = S.WEB_POS[1] + rand(-0.01, 0.01);
              bb.heading = rand(0, 2 * Math.PI); bb.speed = 0; bb.darting = false; bb.timer = rand(0, 0.3);
            }
            if (!active) { bb.alive = false; B.o.visible = false; return; }
            const z = stepBaby(bb, dt, c);
            B.o.visible = true; B.o.scale.setScalar(bb.size);
            B.o.position.set(bb.x, bb.y, z);
            const dx = Math.cos(bb.heading), dy = Math.sin(bb.heading);
            B.o.quaternion.setFromAxisAngle(Z, Math.atan2(dx, -dy)).multiply(qHang);
            animateBody(bb.r, bb.st, t, bb.speed > 0.01 ? "walk" : "idle");
          });

          // ---------- eyes, then the giant ----------
          const es = eyeState(c);
          if (eyes && eyesHome) {
            eyes.visible = isShown && !!es && es.open > 0.01;
            if (es) {
              eyes.position.copy(eyesHome).add(new Vector3(0, -S.EYES_RISE * (1 - es.rise), 0));
              eyes.quaternion.copy(qTilt);
              eyes.scale.set(S.GIANT_SCALE, S.GIANT_SCALE * Math.max(es.open, 0.01), S.GIANT_SCALE);
            }
          }
          const G = giant.SpiderRig;
          let gy = null, gmode = "idle";
          if (within(c, 3, 4.2))          { gy = -S.GIANT_RISE * (1 - smooth((c - 3) / 1.2)); gmode = "flail"; }
          else if (within(c, 4.2, 12.5))  { gy = 0; }
          else if (within(c, 12.5, 13.7)) { gy = -S.GIANT_RISE * smooth((c - 12.5) / 1.2); gmode = "flail"; }
          G.o.visible = isShown && gy !== null;
          setBodySolid(giant, S.GIANT_SOLID && within(c, 4.2, 12.5));   // solid only once it has fully risen
          if (G.o.visible) {
            G.o.position.set(S.GIANT_PEEK[0], S.GIANT_PEEK[1] + gy, S.GIANT_PEEK[2]);
            G.o.quaternion.copy(G.q).multiply(qTilt);
            animateBody(giant, stGiant, t, gmode);
          }

          // ---------- finale: you are the spider ----------
          if (you) {
            const Yr = you.SpiderRig;
            let grow = 0, ymode = "idle";
            if (within(c, 18, 18.8))        { grow = smooth((c - 18) / 0.8); ymode = "flail"; }
            else if (within(c, 18.8, 23.5)) { grow = 1; }
            else if (within(c, 23.5, 24.3)) { grow = 1 - smooth((c - 23.5) / 0.8); ymode = "flail"; }
            Yr.o.visible = isShown && grow > 0.01;
            if (Yr.o.visible) {
              Yr.o.position.set(...S.YOU_POS);
              Yr.o.scale.setScalar(S.YOU_SCALE * Math.max(grow, 0.01));
              animateBody(you, stYou, t, ymode);
            }
          }

          const cap = isShown ? S.CAPTIONS.find(([a, b]) => within(c, a, b)) : null;
          if (cap) $("caption").textContent = cap[2];
          $("caption").classList.toggle("on", !!cap);
          $("curse").classList.toggle("on", isShown && since > S.CURSE_BUTTON_AT);
          // ================= MUMMY MODE =================
          const mummyOn = faceOn && MODE === "mummy";
          if (mummyOn && !mWasOn) { mStart = t; mPainted = -1; mPrevM = -1; babies.forEach(bb => bb.m = null); }
          mWasOn = mummyOn;
          if (mummy && mummy.mesh) {
            mummy.mesh.visible = mummyOn;
            if (mummy.material) { mummy.material.depthTest = false; mummy.material.depthWrite = false; }
          }
          if (hood) {
            hood.group.visible = mummyOn;
            if (mummyOn) {
              const k = S.HOOD_SCALE;
              hood.group.position.set(...S.HOOD_CENTER);
              hood.group.scale.set(S.HOOD_RADII[0] * k, S.HOOD_RADII[1] * k, S.HOOD_RADII[2] * k);
              const f = Math.min(1, (t - mStart) / S.MUMMY_WRAP_SECONDS);
              hood.ribbons.forEach((r, i) => r.visible = i < Math.ceil(f * hood.ribbons.length));
            }
          }
          if (mummyOn) {
            const m = t - mStart, mc = m % S.MUMMY_CYCLE, prevMc = mPrevM < 0 ? -1 : mPrevM % S.MUMMY_CYCLE;
            const crossed = at => (mPrevM < 0 ? -1 : prevMc) < at && mc >= at && mc >= prevMc;
            // wind the bandages on, strip by strip
            const want = Math.min(30, Math.ceil(Math.min(1, m / S.MUMMY_WRAP_SECONDS) * 30));
            if (want !== mPainted && mctx) {
              paintMummy(mctx, want); mummyTex.needsUpdate = true;
              if (want > mPainted && want % 2 === 0) play("swish");
              mPainted = want;
            }
            if (crossed(S.MUMMY_WRAP_SECONDS) || crossed(11.5)) play("moan");
            // spiders crawl out from under the wraps, wander, and slip back under
            babies.forEach((bb, i) => {
              if (!bb.r || i >= S.MUMMY_SPIDERS) return;
              const B = bb.r.SpiderRig;
              if (!bb.m) bb.m = { alive: false, next: S.MUMMY_WRAP_SECONDS + 0.8 + rand(0, 3), age: 0, life: 0 };
              const st = bb.m;
              if (!st.alive && m >= st.next) {
                st.alive = true; st.age = 0; st.life = rand(3, 7);
                bb.x = S.BABY_ZONE.x + rand(-0.04, 0.04); bb.y = S.BABY_ZONE.y + rand(-0.05, 0.05);
                bb.heading = rand(0, 2 * Math.PI); bb.speed = 0; bb.darting = true; bb.timer = rand(0.2, 0.6);
                bb.targetSpeed = rand(...S.BABY_SPEED);
                if (t - lastSkitter > 0.8) { play("skitter", 0.5, 1.2); lastSkitter = t; }
              }
              if (st.alive) {
                st.age += dt;
                if (st.age > st.life) { st.alive = false; st.next = m + rand(0.5, 2.5); }
              }
              if (!st.alive) { B.o.visible = false; return; }
              const z = stepBaby(bb, dt, 0);
              B.o.visible = true;
              B.o.scale.setScalar(bb.size * Math.min(1, st.age / 0.3, (st.life - st.age) / 0.3));
              B.o.position.set(bb.x, bb.y, z);
              const dx = Math.cos(bb.heading), dy = Math.sin(bb.heading);
              B.o.quaternion.setFromAxisAngle(Z, Math.atan2(dx, -dy)).multiply(qHang);
              animateBody(bb.r, bb.st, t, bb.speed > 0.01 ? "walk" : "idle");
            });
            const mcap = S.MUMMY_CAPTIONS.find(([a, b]) => within(mc, a, b));
            if (mcap) $("caption").textContent = mcap[2];
            $("caption").classList.toggle("on", !!mcap);
            $("curse").classList.toggle("on", m > 5);
            mPrevM = m;
          } else if (MODE === "mummy") {
            babies.forEach(bb => { if (bb.r) bb.r.SpiderRig.o.visible = false; });
          }

          prevC = c;
          if (debug) log(`ok | mode=${MODE} | face=${faceOn} | mummy=${mummy ? (mummy.mesh ? "mesh" : "no mesh") : "none"} | t=${since.toFixed(1)} | cycle=${c.toFixed(1)} | audio=${ac ? ac.state : "off"}`);
        }
        requestAnimationFrame(tick);

        // ---------- ?tune panel: live sliders, freeze, jump, copy ----------
        if (tuneMode) {
          const P = document.createElement("div");
          P.className = "ui";
          P.style.cssText = "left:0;right:0;bottom:0;background:#000c;color:#fff;font:13px system-ui;padding:8px 12px 14px;";
          const rows = [
            ["Mom size",       () => S.SMALL_SCALE,  v => S.SMALL_SCALE = v,  0.3, 1.0, 0.01],
            ["Mom up/down",    () => S.MOM_OFFSET[1], v => S.MOM_OFFSET[1] = v, -0.06, 0.06, 0.002],
            ["Mom depth",      () => S.MOM_OFFSET[2], v => S.MOM_OFFSET[2] = v, -0.06, 0.06, 0.002],
            ["Face depth",     () => S.WEB_POS[2],   v => S.WEB_POS[2] = v,   0.03, 0.16, 0.002],
            ["Face curve",     () => S.FACE_CURVE,   v => { S.FACE_CURVE = v; rebuildWeb(); }, 0, 10, 0.1],
            ["Web up/down",    () => S.WEB_POS[1],   v => S.WEB_POS[1] = v,   -0.28, -0.06, 0.002],
            ["Hood size",      () => S.HOOD_SCALE,   v => S.HOOD_SCALE = v,   0.7, 1.5, 0.01],
            ["Hood up/down",   () => S.HOOD_CENTER[1], v => S.HOOD_CENTER[1] = v, -0.2, 0.0, 0.002],
            ["Hood depth",     () => S.HOOD_CENTER[2], v => S.HOOD_CENTER[2] = v, -0.1, 0.05, 0.002],
          ];
          const out = document.createElement("pre");
          out.style.cssText = "margin:6px 0 0;font:11px monospace;color:#0f0;white-space:pre-wrap;";
          const settingsText = () =>
            `SMALL_SCALE: ${S.SMALL_SCALE.toFixed(2)},\n` +
            `WEB_POS: [0, ${S.WEB_POS[1].toFixed(3)}, ${S.WEB_POS[2].toFixed(3)}],\n` +
            `FACE_CURVE: ${S.FACE_CURVE.toFixed(1)},\n` +
            `MOM_OFFSET: [0, ${S.MOM_OFFSET[1].toFixed(3)}, ${S.MOM_OFFSET[2].toFixed(3)}],\n` +
            `HOOD_CENTER: [0, ${S.HOOD_CENTER[1].toFixed(3)}, ${S.HOOD_CENTER[2].toFixed(3)}],\n` +
            `HOOD_SCALE: ${S.HOOD_SCALE.toFixed(2)},`;
          const refresh = () => { out.textContent = settingsText(); };
          rows.forEach(([label, get, set, min, max, step]) => {
            const row = document.createElement("label");
            row.style.cssText = "display:flex;align-items:center;gap:8px;margin:3px 0;";
            const val = document.createElement("span"); val.style.cssText = "width:48px;text-align:right;font-family:monospace;";
            const r = document.createElement("input");
            Object.assign(r, { type: "range", min, max, step, value: get() }); r.style.flex = "1";
            const name = document.createElement("span"); name.textContent = label; name.style.width = "92px";
            const show = () => { val.textContent = (+r.value).toFixed(3); };
            r.addEventListener("input", () => { set(+r.value); show(); refresh(); });
            show(); row.append(name, r, val); P.append(row);
          });
          const bar = document.createElement("div"); bar.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;";
          const btn = (label, fn) => { const b = document.createElement("button"); b.textContent = label;
            b.style.cssText = "font:13px system-ui;padding:6px 10px;border-radius:14px;border:1px solid #888;background:#222;color:#fff;";
            b.addEventListener("click", fn); bar.append(b); return b; };
          [["Rappel", 6], ["Web", 10], ["Babies", 12], ["Giant", 6.5], ["Finale", 20]].forEach(([label, at]) =>
            btn(label, () => { TIME.jumpTo = at; if (TIME.frozenAt !== null) TIME.frozenAt = at; }));
          const fz = btn("Freeze", () => {
            if (TIME.frozenAt === null) { const c = (performance.now() / 1000 - start - S.CYCLE_START) % S.CYCLE_SECONDS; TIME.frozenAt = Math.max(0, c); fz.textContent = "Unfreeze"; }
            else { TIME.frozenAt = null; fz.textContent = "Freeze"; }
          });
          btn("Copy numbers", () => { navigator.clipboard && navigator.clipboard.writeText(settingsText()); });
          btn("Hide", () => { P.style.display = "none"; });
          P.append(bar, out); refresh(); document.body.append(P);
        }
        function rebuildWeb() {
          if (!web) return;
          const fresh = makeWeb(S.WEB_RADIUS);
          web.geometry.dispose(); web.geometry = fresh.geometry;
          web.userData.segments = fresh.userData.segments;
        }

        // ---------- entry screen (unlocks sound), mute, tap to replay ----------
        function selectMode(m) {
          MODE = m; wasShown = false; mWasOn = false;
          $("menu").classList.remove("on"); $("again").classList.add("on");
        }
        $("start").addEventListener("click", () => {
          initAudio(); $("start").classList.add("off"); $("mute").classList.add("on");
          if (MODE_PARAM === "spiders" || MODE_PARAM === "mummy") selectMode(MODE_PARAM);
          else $("menu").classList.add("on");
        });
        document.querySelectorAll("#menu .card").forEach(b =>
          b.addEventListener("click", () => { if (!b.disabled) selectMode(b.dataset.mode); }));
        $("again").addEventListener("click", () => {
          MODE = null; $("again").classList.remove("on"); $("menu").classList.add("on");
          $("caption").classList.remove("on"); $("curse").classList.remove("on");
        });
        $("mute").addEventListener("click", () => {
          muted = !muted; if (master) master.gain.value = muted ? 0 : S.VOLUME;
          $("mute").textContent = muted ? "🔇" : "🔊";
        });
        window.addEventListener("pointerdown", e => {
          if (e.target.closest && e.target.closest(".ui")) return;
          if (tuneMode) return;
          if (MODE === "mummy") { mWasOn = false; return; }        // re-wrap from the start
          start = performance.now() / 1000; prevC = -1; prevSince = -1;
        });

        // ---------- Take the curse home ----------
        function snap() {
          const gl = (context.renderer && context.renderer.domElement) || document.querySelector("needle-engine canvas");
          if (context.renderer && context.mainCamera) context.renderer.render(context.scene, context.mainCamera);
          const W = gl.width, H = gl.height;
          const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
          const g = cv.getContext("2d");
          const v = document.querySelector("video");
          if (v && v.videoWidth) {
            const k = Math.max(W / v.videoWidth, H / v.videoHeight), w = v.videoWidth * k, h = v.videoHeight * k;
            g.save(); g.translate(W, 0); g.scale(-1, 1); g.drawImage(v, (W - w) / 2, (H - h) / 2, w, h); g.restore();
          }
          g.drawImage(gl, 0, 0, W, H);
          const fs = Math.round(W * 0.075);
          g.font = `${fs}px Creepster, Impact, sans-serif`; g.textAlign = "center";
          g.shadowColor = "#000"; g.shadowBlur = fs * 0.35; g.fillStyle = "#ff2a1a";
          g.fillText("SCAN AND SCREAM", W / 2, H - fs * 0.9);
          return cv.toDataURL("image/jpeg", 0.92);
        }
        function toFile(dataURL) {
          const bin = atob(dataURL.split(",")[1]); const a = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
          return new File([a], "scan-and-scream.jpg", { type: "image/jpeg" });
        }
        let lastShot = null;
        $("curse").addEventListener("click", () => {
          try { lastShot = snap(); $("shot").src = lastShot; $("preview").classList.add("on"); }
          catch (err) { log("photo failed: " + err.message); }
        });
        $("share").addEventListener("click", () => {
          if (!lastShot) return;
          const f = toFile(lastShot);
          if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: "Scan and Scream" }).catch(() => {});
          else $("hint").textContent = "Sharing isn't available here. Press and hold the photo to save it.";
        });
        $("close").addEventListener("click", () => $("preview").classList.remove("on"));
      });
    </script>
  </body>
</html>
