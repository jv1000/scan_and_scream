<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --tape: #efe3b8; --ink: #1f2b5c; --red-ink: #9a1c1c; --room: #07090b; --uv: #8a5cff; --glow: #9dff6a; --shadow: rgba(0,0,0,0.6);
    --hand: "Caveat", "Bradley Hand", "Comic Sans MS", cursive; --type: "Special Elite", "American Typewriter", "Courier New", monospace;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tape: #e6d9a8; } }
  :root[data-theme="dark"] { --tape: #e6d9a8; }
  html { height: 100%; } body { margin: 0; height: 100%; background: var(--room); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tape { font-family: var(--hand); font-weight: 700; color: var(--ink); background: var(--tape); border: 0; padding: 6px 16px 5px; font-size: 22px;
          line-height: 1.1; box-shadow: 0 2px 6px var(--shadow); text-decoration: none; display: inline-block;
          clip-path: polygon(2% 8%, 7% 0, 14% 7%, 22% 1%, 31% 6%, 42% 0, 55% 5%, 66% 0, 78% 6%, 88% 1%, 96% 7%, 100% 4%, 98% 92%, 93% 100%, 84% 94%, 73% 100%, 61% 95%, 49% 100%, 37% 94%, 25% 100%, 13% 95%, 4% 100%, 0 90%); }
  button.tape, a.tape { cursor: pointer; } .tape:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
  #caption { position: fixed; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; pointer-events: none;
             font-family: var(--hand); font-size: 34px; color: #e9ffe0; text-shadow: 0 0 12px #000, 0 0 3px #000; opacity: 0; transition: opacity 0.5s; padding: 0 16px; }
  #caption.on { opacity: 1; }
  #recenter { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 18px; transform: rotate(2deg); display: none; }
  #mute { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 18px; transform: rotate(-2deg); display: none; }
  .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px;
          background: radial-gradient(ellipse at 50% 55%, rgba(7,9,11,0.45), rgba(7,9,11,0.94) 70%); }
  .card p { margin: 0; font-family: var(--type); color: #d6ddd8; font-size: 17px; max-width: 28ch; line-height: 1.55; }
  .card .sign { font-family: var(--hand); font-size: 60px; color: var(--glow); text-shadow: 0 0 18px rgba(157,255,106,0.6); line-height: 1; }
  .card .tape { font-size: 26px; }
  .card .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .hidden { display: none !important; }
  #zoom { position: fixed; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); font-size: 20px; transform: rotate(-2deg); display: none; }
  #uvbtn { position: fixed; left: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); font-size: 20px; transform: rotate(2deg); display: none; background: #d9ccf7; }
  #uvbtn[aria-pressed="true"] { background: var(--uv); color: #fff; box-shadow: 0 0 18px var(--uv); }
  #putback { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-1.5deg); font-size: 22px; display: none; }
  #reticle { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px dashed rgba(233,255,224,0.8);
             border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 6px #000, inset 0 0 6px #000; }
  #dbg { position: fixed; left: 8px; bottom: 8px; font: 12px monospace; color: #0f0; background: #000a; padding: 3px 6px; display: none; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="scene" aria-label="Augmented reality haunted lab around you"></canvas>
<div id="caption"></div>
<button id="mute" class="tape" aria-pressed="false">sound on</button>
<button id="recenter" class="tape">face the lab</button>
<button id="zoom" class="tape" aria-label="Reset zoom">1×</button>
<button id="uvbtn" class="tape" aria-pressed="false">UV lamp: off</button>
<button id="putback" class="tape">Put it back</button>
<div id="reticle"></div>
<div id="door" class="card">
  <div class="sign">Lab 13</div>
  <p>Authorized personnel only. Stand where you have room to turn around.</p>
  <button id="enter" class="tape">Flip the switch</button>
</div>
<div id="outro" class="card hidden">
  <div class="sign">Lab 13 is closed</div>
  <p>Please leave the way you came. Don't take anything with you.</p>
  <div class="row">
    <button id="explore" class="tape">Keep exploring</button>
    <button id="again" class="tape">Run it again</button>
    <a id="selfie" class="tape" href="https://jv1000.github.io/scan_and_scream/spider.html?mode=lab">Mad Lab selfie</a>
  </div>
</div>
<div id="dbg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
// ===================== HAUNTED LAB 13 =====================
// buildLab(THREE, scene) builds the room and returns { update(t, dt, camera), setUV(on), events }.
function buildLab(T, scene, opts = {}) {
  const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
  const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
  const events = { beep: null, flatline: null, bubble: null, whisper: null, crackle: null };
  const INK = "#1f2b5c";

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); draw(g, w, h);
    const tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding; tex.anisotropy = 4;
    return { tex, canvas: c, g };
  }
  const std = (color, o = {}) => new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.7, metalness: 0.05 }, o));
  const glassMat = new T.MeshStandardMaterial({ color: 0xd8f2ff, transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.2, side: T.DoubleSide, depthWrite: false });
  const updaters = [];

  // ---------------- room ----------------
  const tiles = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = "#b9c2bd"; g.fillRect(0, 0, w, h);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 4; x++) {
      const v = 200 + Math.floor(rand(-14, 10));
      g.fillStyle = `rgb(${v},${v + 6},${v + 2})`; g.fillRect(x * 128 + 3, y * 64 + 3, 122, 58);
    }
    for (let i = 0; i < 26; i++) {                      // grime and old stains
      const x = rand(0, w), y = rand(0, h), r = rand(20, 90), c = g.createRadialGradient(x, y, 0, x, y, r);
      c.addColorStop(0, `rgba(70,80,50,${rand(0.08, 0.25)})`); c.addColorStop(1, "rgba(70,80,50,0)");
      g.fillStyle = c; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    g.strokeStyle = "rgba(60,90,40,0.35)"; g.lineWidth = 4;   // something green dripped down
    for (let i = 0; i < 5; i++) { const x = rand(0, w); g.beginPath(); g.moveTo(x, rand(0, 150)); g.lineTo(x + rand(-4, 4), rand(250, 512)); g.stroke(); }
  });
  tiles.tex.wrapS = tiles.tex.wrapT = T.RepeatWrapping; tiles.tex.repeat.set(4, 2);
  const floorTex = canvasTex(256, 256, (g, w, h) => {
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = (x + y) % 2 ? "#2a3430" : "#3c4742"; g.fillRect(x * 64, y * 64, 64, 64); }
    for (let i = 0; i < 12; i++) { const x = rand(0, w), y = rand(0, h), r = rand(10, 50), c = g.createRadialGradient(x, y, 0, x, y, r);
      c.addColorStop(0, "rgba(10,12,10,0.4)"); c.addColorStop(1, "rgba(10,12,10,0)"); g.fillStyle = c; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  });
  floorTex.tex.wrapS = floorTex.tex.wrapT = T.RepeatWrapping; floorTex.tex.repeat.set(4, 3);
  const floor = new T.Mesh(new T.PlaneGeometry(9, 7), std(0xffffff, { map: floorTex.tex, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.z = -0.5; if (!opts.ar) scene.add(floor);   // in AR your real floor is the floor
  const wallMat = std(0xffffff, { map: tiles.tex, roughness: 0.6 });
  if (!opts.ar) {
    const back = new T.Mesh(new T.PlaneGeometry(9, 3.2), wallMat); back.position.set(0, 1.6, -3); scene.add(back);
    for (const sx of [-1, 1]) {
      const side = new T.Mesh(new T.PlaneGeometry(7, 3.2), wallMat); side.position.set(sx * 4.5, 1.6, 0.5); side.rotation.y = -sx * Math.PI / 2; scene.add(side);
    }
    const ceil = new T.Mesh(new T.PlaneGeometry(9, 7), std(0x20252a)); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 3.2, 0.5); scene.add(ceil);
  }

  // ---------------- lights ----------------
  const hemi = new T.HemisphereLight(0x9fb0b8, 0x141418, 0.45); scene.add(hemi);
  const tube = new T.Mesh(new T.BoxGeometry(1.6, 0.05, 0.12), new T.MeshStandardMaterial({ color: 0xe8fff0, emissive: 0xdfffe8, emissiveIntensity: 1.5 }));
  tube.position.set(0, 3.12, -0.8); tube.visible = !opts.ar; scene.add(tube);
  const overhead = new T.PointLight(0xe6fff0, 1.3, 11, 1.6); overhead.position.set(0, 2.9, -0.8); scene.add(overhead);
  const wetGlow = new T.PointLight(0x6dff9a, 0.7, 3.5, 2); wetGlow.position.set(-2.5, 1.35, -0.9); scene.add(wetGlow);
  const synthGlow = new T.PointLight(0xff3cc8, 0.8, 3.5, 2); synthGlow.position.set(0, 1.4, -2.1); scene.add(synthGlow);
  const plasmaGlow = new T.PointLight(0xb86bff, 0.8, 3, 2); plasmaGlow.position.set(2.9, 1.25, -1.0); scene.add(plasmaGlow);
  let flickerUntil = 0, nextFlicker = 3, power = 0, powerMix = 0;
  updaters.push((t) => {
    if (power > 0 && !opts.reducedMotion && t > nextFlicker) { flickerUntil = t + rand(0.3, 1.1); nextFlicker = t + rand(4, 11); if (events.crackle) events.crackle(); }
    if (power > 0 && powerMix === 0) { flickerUntil = t + 1.3; nextFlicker = t + 6; }   // stutter on, like old tubes do
    powerMix = power;
    const base = (labUV ? 0.12 : 1.3) * power;
    const k = t < flickerUntil ? (Math.random() < 0.45 ? 0.08 : 1) : 1;
    overhead.intensity = base * k; tube.material.emissiveIntensity = (labUV ? 0.2 : 1.5) * k * power + 0.02;
  });

  // ---------------- benches ----------------
  function bench(x, z, w = 2.2) {
    const g = new T.Group();
    const top = new T.Mesh(new T.BoxGeometry(w, 0.06, 0.85), std(0x121417, { roughness: 0.35 })); top.position.y = 0.92;
    const body = new T.Mesh(new T.BoxGeometry(w - 0.1, 0.86, 0.78), std(0x39413d, { roughness: 0.8 })); body.position.y = 0.46;
    g.add(top, body);
    for (let i = 0; i < 3; i++) {
      const h = new T.Mesh(new T.BoxGeometry(0.18, 0.025, 0.03), std(0x8a8f92, { metalness: 0.7, roughness: 0.3 }));
      h.position.set(-w / 2 + 0.4 + i * (w - 0.8) / 2, 0.72, 0.4); g.add(h);
    }
    g.position.set(x, 0, z); scene.add(g); return g;
  }
  const wet = bench(-2.5, -1.1), synth = bench(0, -2.35, 2.6), inst = bench(2.5, -1.1);
  wet.rotation.y = 0.35; inst.rotation.y = -0.35;

  // ---------------- glassware ----------------
  const uvLiquids = [];
  function vessel(parent, kind, x, z, color, fill, opts = {}) {
    const g = new T.Group(); g.position.set(x, 0.95, z); parent.add(g);
    let outline, inner;
    if (kind === "beaker") { const r = opts.r || 0.07, h = opts.h || 0.16;
      outline = [[0, 0], [r, 0], [r, h], [r * 1.1, h * 1.03]]; inner = [[0, 0.004], [r - 0.004, 0.004], [r - 0.004, h * fill], [0, h * fill]]; }
    else if (kind === "flask") { const r = opts.r || 0.09;
      outline = [[0, 0], [r, 0], [r, 0.012], [0.028, 0.17], [0.028, 0.23], [0.034, 0.24]];
      const fh = 0.17 * fill, rr = r - (r - 0.028) * (fh / 0.17);
      inner = [[0, 0.004], [r - 0.005, 0.004], [r - 0.005, 0.012], [rr - 0.004, fh], [0, fh]]; }
    else if (kind === "jar") { const r = opts.r || 0.1, h = opts.h || 0.26;
      outline = [[0, 0], [r, 0], [r, h]]; inner = [[0, 0.004], [r - 0.005, 0.004], [r - 0.005, h * fill], [0, h * fill]]; }
    const v2 = a => a.map(([px, py]) => new T.Vector2(px, py));
    g.add(new T.Mesh(new T.LatheGeometry(v2(outline), 32), glassMat));
    // pourable glassware: the liquid runs up to the rim and a level plane in world space cuts it off,
    // so the surface stays flat when you tilt the glass, and the fill can change
    let pour = null;
    if (opts.pour) {
      const flask = kind === "flask", r = opts.r || (flask ? 0.09 : 0.07), hEff = flask ? 0.17 : (opts.h || 0.16), rimH = flask ? 0.24 : (opts.h || 0.16);
      inner = flask ? [[0, 0.004], [r - 0.005, 0.004], [r - 0.005, 0.012], [0.024, 0.17], [0.024, rimH - 0.004], [0, rimH - 0.004]]
                    : [[0, 0.004], [r - 0.004, 0.004], [r - 0.004, rimH - 0.002], [0, rimH - 0.002]];
      pour = { key: opts.pour, flask, fill, fill0: fill, r, rimH, hEff, lipR: flask ? 0.03 : r * 1.05, maxFill: (rimH - 0.008) / hEff,
               cap: r * r * hEff * (flask ? 0.55 : 1), plane: new T.Plane(new T.Vector3(0, -1, 0), 0), color0: new T.Color(color), glow0: opts.glow || 0.5,
               boost: 1, s: new T.Vector3(), sv: new T.Vector3(), prevA: null };
    }
    const lmat = new T.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: opts.glow || 0.5, roughness: 0.25, transparent: true, opacity: opts.opacity || 0.85 });
    if (pour) { lmat.clippingPlanes = [pour.plane]; lmat.side = T.DoubleSide; }
    const liquid = new T.Mesh(new T.LatheGeometry(v2(inner), 32), lmat); g.add(liquid);
    if (kind === "jar") { const lid = new T.Mesh(new T.CylinderGeometry((opts.r || 0.1) * 1.05, (opts.r || 0.1) * 1.05, 0.03, 32), std(0x2d2a26, { metalness: 0.6, roughness: 0.4 })); lid.position.y = (opts.h || 0.26) + 0.015; g.add(lid); }
    if (opts.uv) uvLiquids.push({ mat: lmat, base: opts.glow || 0.5 });
    // bubbles
    const topY = inner[inner.length - 1][1], bubbles = [];
    const bm = new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
    if (pour) bm.clippingPlanes = [pour.plane];
    const n = opts.bubbles === undefined ? 5 : opts.bubbles;
    for (let i = 0; i < n; i++) { const b = new T.Mesh(new T.SphereGeometry(0.004, 6, 5), bm); b.userData = { y: rand(0, topY), a: rand(0, 6.3), r: rand(0, 0.025), v: rand(0.04, 0.09) * (opts.boil || 1) }; g.add(b); bubbles.push(b); }
    updaters.push((t, dt) => { for (const b of bubbles) { const u = b.userData; u.y += u.v * dt * (pour ? pour.boost : 1); if (u.y > topY) { u.y = 0.01; u.a = rand(0, 6.3); u.r = rand(0, 0.025); } b.position.set(Math.cos(u.a) * u.r, u.y, Math.sin(u.a) * u.r); } });
    return { group: g, liquid: lmat, topY, pour };
  }

  // ---------------- WET LAB ----------------
  const tonic = vessel(wet, "beaker", -0.75, 0.12, 0x7fd6ff, 0.75, { uv: true, glow: 0.35, pour: "tonic" });          // tonic water
  const ink = vessel(wet, "flask", -0.45, -0.1, 0x8dff4a, 0.6, { uv: true, glow: 0.45, pour: "ink" });            // highlighter ink
  const red = vessel(wet, "beaker", -0.15, 0.18, 0x7a0a10, 0.8, { r: 0.05, h: 0.13, glow: 0.2, opacity: 0.95, pour: "red" });   // don't ask
  const dry = vessel(wet, "beaker", 0.2, 0.05, 0xdfe7ee, 0.5, { r: 0.09, h: 0.18, glow: 0.3, boil: 3, bubbles: 10, pour: "dry" });  // dry ice
  // specimen jars with eyeballs that watch you
  const eyeTex = canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = "#f2ece2"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(170,20,20,0.55)"; g.lineWidth = 1.5;
    for (let i = 0; i < 30; i++) { g.beginPath(); let x = rand(0, w), y = rand(0, h); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += rand(-14, 14); y += rand(-10, 10); g.lineTo(x, y); } g.stroke(); }
    const cx = w * 0.75, cy = h * 0.5;     // iris faces +Z after rotation
    const ir = g.createRadialGradient(cx, cy, 2, cx, cy, 22); ir.addColorStop(0, "#1c6b3a"); ir.addColorStop(0.8, "#2f9a5a"); ir.addColorStop(1, "#123"); 
    g.fillStyle = ir; g.beginPath(); g.ellipse(cx, cy, 20, 26, 0, 0, 7); g.fill();
    g.fillStyle = "#050505"; g.beginPath(); g.ellipse(cx, cy, 8, 10, 0, 0, 7); g.fill();
  });
  const eyeMat = std(0xffffff, { map: eyeTex.tex, roughness: 0.3, emissive: 0x222222, emissiveMap: eyeTex.tex, emissiveIntensity: 0.15 });
  const eyes = [], jars = [];
  for (const [jx, jz, n] of [[0.55, -0.12, 3], [0.8, 0.14, 2]]) {
    const jar = vessel(wet, "jar", jx, jz, 0xc9d86a, 0.85, { r: 0.1, h: 0.26, glow: 0.15, opacity: 0.45, bubbles: 2 });
    const jarEyes = [];
    for (let i = 0; i < n; i++) {
      const e = new T.Mesh(new T.SphereGeometry(0.03, 20, 14), eyeMat);
      e.userData = { base: new T.Vector3(rand(-0.04, 0.04), rand(0.05, 0.17), rand(-0.04, 0.04)), ph: rand(0, 6.3),
                     off: new T.Vector3(), vel: new T.Vector3(), axis: new T.Vector3(0, 1, 0), w: 0, settle: 0 };
      jar.group.add(e); eyes.push(e); jarEyes.push(e);
    }
    jars.push({ kind: "jar", group: jar.group, eyes: jarEyes, wobbleAt: -1e9 });
  }
  const label = (text, sub, w = 0.26, h = 0.1) => {
    const c = canvasTex(512, 200, (g, W, H) => {
      g.fillStyle = "#efe3b8"; g.fillRect(0, 0, W, H);
      g.fillStyle = INK; g.font = "600 76px Caveat, cursive"; g.fillText(text, 18, 86);
      if (sub) { g.font = "600 52px Caveat, cursive"; g.fillStyle = "#8a1a1a"; g.fillText(sub, 18, 160); }
    });
    return new T.Mesh(new T.PlaneGeometry(w, h), std(0xffffff, { map: c.tex, roughness: 0.9 }));
  };
  const lab13 = label("Specimen 13", "DO NOT FEED"); lab13.position.set(0.62, 1.07, 0.3); lab13.rotation.x = -0.9; wet.add(lab13);
  const eyeP = new T.Vector3(), eyeW = new T.Vector3(), eyeQ = new T.Quaternion(), eyeGoal = new T.Quaternion();
  updaters.push((t, dt, cam) => {
    for (const jr of jars) {                // a rattled jar rocks on its base and settles
      const s = t - jr.wobbleAt, k = s < 2.5 ? Math.exp(-2.4 * s) : 0;
      jr.group.rotation.z = 0.13 * k * Math.sin(19 * s); jr.group.rotation.x = 0.09 * k * Math.sin(16 * s + 1);
    }
    for (const e of eyes) { const u = e.userData;
      // thick liquid: a soft spring pulls each eye home, drag slows it, the glass stops it
      u.vel.addScaledVector(u.off, -38 * dt).multiplyScalar(Math.exp(-2.2 * dt)); u.off.addScaledVector(u.vel, dt);
      eyeP.copy(u.base).add(u.off);
      const rr = Math.hypot(eyeP.x, eyeP.z);
      if (rr > 0.062) { const nx = eyeP.x / rr, nz = eyeP.z / rr, vn = u.vel.x * nx + u.vel.z * nz;
        eyeP.x = nx * 0.062; eyeP.z = nz * 0.062; if (vn > 0) { u.vel.x -= 1.6 * vn * nx; u.vel.z -= 1.6 * vn * nz; } }
      if (eyeP.y < 0.035) { eyeP.y = 0.035; if (u.vel.y < 0) u.vel.y *= -0.5; }
      if (eyeP.y > 0.2) { eyeP.y = 0.2; if (u.vel.y > 0) u.vel.y *= -0.5; }
      u.off.copy(eyeP).sub(u.base);
      e.position.copy(eyeP).add(eyeW.set(Math.sin(t * 0.7 + u.ph) * 0.01, Math.sin(t * 0.9 + u.ph) * 0.015, 0));
      if (u.w > 0.4) { e.rotateOnAxis(u.axis, u.w * dt); u.w *= Math.exp(-1.1 * dt); u.settle = 1.2; }     // tumbling
      else if (u.settle > 0) { u.settle -= dt; eyeQ.copy(e.quaternion); e.lookAt(cam.position); eyeGoal.copy(e.quaternion);
        e.quaternion.copy(eyeQ).slerp(eyeGoal, Math.min(1, dt * 3)); }                                        // ...and finding you again

  canvas.addEventListener("pointerdown", e => { dragging = { x: e.clientX, y: e.clientY, yaw: dragYaw, pitch: dragPitch }; });
  window.addEventListener("pointermove", e => { if (!dragging || haveOrient) return;
    dragYaw = dragging.yaw + (e.clientX - dragging.x) * 0.005; dragPitch = Math.max(-1.2, Math.min(1.2, dragging.pitch + (e.clientY - dragging.y) * 0.004)); });
  window.addEventListener("pointerup", () => { dragging = null; });
  function faceLab() {                                    // turn the lab so its front is where you're looking now
    const f = new T.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); f.y = 0;
    if (f.lengthSq() < 1e-4) return; f.normalize();
    pivot.rotation.y = Math.atan2(-f.x, -f.z); facedLab = true; facedWithOrient = haveOrient;
  }
  $("recenter").addEventListener("click", faceLab);

  // ---- zoom: pinch (two fingers) or double-tap; the room and the lab zoom together ----
  let zoom = 1, zoomGoal = 1, baseFov = 64, pinch = null, lastTap = 0;
  const ZMAX = 4, clampZ = z => Math.min(ZMAX, Math.max(1, z));
  const fingerGap = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  canvas.addEventListener("touchstart", e => {
    if (e.touches.length === 2) { pinch = { d: fingerGap(e), z: zoomGoal }; dragging = null; tapStart = null; e.preventDefault(); }
    else if (e.touches.length === 1) {
      const now = performance.now();
      if (now - lastTap < 300) { zoomGoal = zoomGoal > 1.2 ? 1 : 2.5; lastTap = 0; e.preventDefault(); } else lastTap = now;
    }
  }, { passive: false });
  canvas.addEventListener("touchmove", e => {
    if (pinch && e.touches.length === 2) { zoomGoal = clampZ(pinch.z * fingerGap(e) / pinch.d); e.preventDefault(); }
  }, { passive: false });
  canvas.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
  canvas.addEventListener("wheel", e => { zoomGoal = clampZ(zoomGoal * Math.exp(-e.deltaY * 0.002)); e.preventDefault(); }, { passive: false });   // laptop testing
  $("zoom").addEventListener("click", () => { zoomGoal = 1; });

  // ---- touching the lab (Keep exploring only): a quick tap on a jar or a glass ----
  let tapStart = null; const ndc = new T.Vector2();
  canvas.addEventListener("pointerdown", e => { tapStart = e.isPrimary ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; });
  canvas.addEventListener("pointerup", e => {
    const s = tapStart; tapStart = null;
    if (!s || !e.isPrimary || !exploring || pinch) return;
    if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > 14 || performance.now() - s.t > 450) return;
    const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    if (lab.tap(ndc, camera)) lastTap = 0;           // a tap on a thing isn't half of a double-tap zoom
  });
  $("putback").addEventListener("click", () => { lab.putBack(); play("clink"); });
  // shaking: a hard jolt from the motion sensor
  let lastJolt = 0;
  window.addEventListener("devicemotion", e => {
    const a = e.acceleration, g = e.accelerationIncludingGravity; let m = 0;
    if (a && a.x !== null) m = Math.hypot(a.x, a.y, a.z); else if (g && g.x !== null) m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81);
    if (m > 13 && exploring && clock - lastJolt > 0.12) { lastJolt = clock; lab.shake(); }
  });
  function applyZoom(dt) {
    zoom += (zoomGoal - zoom) * Math.min(1, dt * 12);
    if (Math.abs(zoom - zoomGoal) < 0.002) zoom = zoomGoal;
    const f = 2 * Math.atan(Math.tan(T.MathUtils.degToRad(baseFov) / 2) / zoom);
    const deg = T.MathUtils.radToDeg(f);
    if (Math.abs(camera.fov - deg) > 1e-3) { camera.fov = deg; camera.updateProjectionMatrix(); }
    bgMat.uniforms.zoom.value = zoom;
    const z = $("zoom"); z.style.display = zoomGoal > 1.05 && running ? "block" : "none"; z.textContent = zoomGoal.toFixed(1) + "×";
  }

  // ---- sound (all synthesized) ----
  let ac = null, master = null, noiseBuf = null, flatOsc = null, muted = false;
  function env(g, t, pk, a, h, r) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + a); g.gain.setValueAtTime(pk, t + a + h); g.gain.exponentialRampToValueAtTime(0.0001, t + a + h + r); }
  function noise(t, type, hz, q, pk, a, h, r) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = hz; f.Q.value = q;
    const g = ac.createGain(); env(g, t, pk, a, h, r); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + a + h + r + 0.05); return f; }
  function tone(t, type, f0, f1, pk, a, h, r) { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + a + h + r);
    env(g, t, pk, a, h, r); o.connect(g); g.connect(master); o.start(t); o.stop(t + a + h + r + 0.05); }
  function startAudio() { try {
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 320; const g = ac.createGain(); g.gain.value = 0.035; f.connect(g); g.connect(master);
    [60, 120, 180].forEach(hz => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = hz; o.connect(f); o.start(); });
  } catch (e) { ac = null; } }
  const on = () => ac && !muted;
  const SFX = {
    beep() { tone(ac.currentTime, "sine", 1050, 1050, 0.07, 0.005, 0.07, 0.05); },
    bubble() { const t0 = ac.currentTime; for (let i = 0; i < 2; i++) { const f = 250 + Math.random() * 500; tone(t0 + Math.random() * 0.2, "sine", f, f * 1.8, 0.05, 0.004, 0.01, 0.05); } },
    whisper() { const t = ac.currentTime, f = noise(t, "bandpass", 900, 6, 0.3, 0.8, 0.6, 1.2); f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(2000, t + 2.2); },
    crackle() { const t = ac.currentTime; for (let i = 0; i < 6; i++) noise(t + Math.random() * 0.5, "highpass", 3000, 1, 0.06, 0.002, 0.01, 0.03); },
    boom() { const t = ac.currentTime; noise(t, "lowpass", 500, 0.8, 0.9, 0.005, 0.1, 1.3); tone(t, "sine", 70, 28, 0.8, 0.005, 0.1, 0.9);
      for (let i = 0; i < 12; i++) noise(t + 0.05 + Math.random() * 0.7, "highpass", 3000 + Math.random() * 3000, 1, 0.12, 0.002, 0.01, 0.05); },   // + glass tinkling down
    shriek() { const t = ac.currentTime; [1, 1.33, 1.5].forEach(k => tone(t, "sawtooth", 950 * k, 380 * k, 0.12, 0.02, 0.25, 0.5)); noise(t, "bandpass", 2500, 2, 0.4, 0.01, 0.3, 0.5); },
    click() { noise(ac.currentTime, "bandpass", 2500, 3, 0.3, 0.002, 0.01, 0.04); },
    clink() { const t = ac.currentTime; tone(t, "sine", 2400, 2300, 0.09, 0.002, 0.02, 0.35); tone(t, "sine", 3700, 3600, 0.05, 0.002, 0.01, 0.25); },
    squish() { const t = ac.currentTime, f = noise(t + 0.05, "lowpass", 900, 4, 0.25, 0.01, 0.08, 0.2); f.frequency.setValueAtTime(900, t + 0.05); f.frequency.exponentialRampToValueAtTime(200, t + 0.35); },
    trickle() { noise(ac.currentTime, "bandpass", 600 + Math.random() * 900, 8, 0.12, 0.004, 0.02, 0.06); },
    hiss() { noise(ac.currentTime, "highpass", 4000, 0.7, 0.25, 0.05, 0.8, 0.9); },
    fizz() { const t = ac.currentTime; for (let i = 0; i < 14; i++) noise(t + Math.random() * 0.9, "highpass", 5000 + Math.random() * 3000, 1, 0.08, 0.002, 0.005, 0.03); },
    splat() { noise(ac.currentTime, "lowpass", 700, 1, 0.12, 0.003, 0.02, 0.12); },
  };
  const play = n => { if (on()) try { SFX[n](); } catch (e) {} };
  lab.events.beep = () => play("beep"); lab.events.bubble = () => play("bubble"); lab.events.whisper = () => play("whisper");
  let flickerUntil = 0;
  lab.events.crackle = () => { play("crackle"); flickerUntil = clock + 0.7; };
  lab.events.say = text => showCaption(text, 3.6);
  for (const n of ["clink", "squish", "trickle", "hiss", "fizz", "splat", "bubble"]) lab.events[n] = () => play(n);
  lab.events.boom = () => { play("boom"); flash = 1; bgMat.uniforms.flashCol.value.setRGB(0.6, 1.0, 0.5); };
  lab.events.flatline = (start) => { if (!ac) return;
    if (start && !flatOsc) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 1050; g.gain.value = muted ? 0 : 0.05; o.connect(g); g.connect(master); o.start(); flatOsc = o; }
    if (!start && flatOsc) { flatOsc.stop(); flatOsc = null; } };

  // ---- camera start ----
  async function startCamera() {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      video.srcObject = s; await video.play(); bgMat.uniforms.has.value = 1; return true;
    } catch (e) { return false; }
  }
  function fitVideo() {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
    const sa = window.innerWidth / window.innerHeight, va = vw / vh, sc = bgMat.uniforms.scale.value, of = bgMat.uniforms.offset.value;
    if (va > sa) { sc.set(sa / va, 1); of.set((1 - sa / va) / 2, 0); } else { sc.set(1, va / sa); of.set(0, (1 - va / sa) / 2); }
  }

  // ---- run state ----
  let running = false, t0 = 0, clock = 0, fired = {}, lurk = { done: false, lunging: -1 }, flash = 0;
  let exploring = false, exploreStart = 0, lastGhost = 0, prevECycle = -1, uvOn = false;
  function begin() {
    lab.reset(); lab.setPower(false); lab.setUV(false); fired = {}; lurk = { done: false, lunging: -1 };
    $("outro").classList.add("hidden"); t0 = clock; running = true; facedLab = false;
    exploring = false; uvOn = false; $("uvbtn").style.display = "none"; $("uvbtn").setAttribute("aria-pressed", "false"); $("uvbtn").textContent = "UV lamp: off";
  }
  $("enter").addEventListener("click", async () => {
    startAudio(); play("click");
    try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    try { if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") await DeviceMotionEvent.requestPermission(); } catch (e) {}
    const cam = await startCamera();
    $("door").classList.add("hidden"); $("recenter").style.display = "block"; $("mute").style.display = "block";
    if (!cam) showCaption("no camera: you're in the dark lab instead", 4);
    begin();
  });
  $("again").addEventListener("click", () => { play("click"); begin(); });
  $("explore").addEventListener("click", () => {          // lights back on, flask whole again, no timer
    play("click"); lab.reset(); lab.setPower(true); lab.setUV(false); lab.setFlat(null);
    running = false; exploring = true; exploreStart = clock; lastGhost = lab._t || 0; prevECycle = -1; lurk = { done: false, lunging: -1 };
    $("outro").classList.add("hidden"); $("uvbtn").style.display = "block"; $("caption").classList.remove("on");
    showCaption("tap the jars and the glassware... some of them tap back", 5);
  });
  $("uvbtn").addEventListener("click", () => {
    uvOn = !uvOn; lab.setUV(uvOn); play("click");
    $("uvbtn").setAttribute("aria-pressed", String(uvOn)); $("uvbtn").textContent = uvOn ? "UV lamp: on" : "UV lamp: off";
  });
  $("mute").addEventListener("click", () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; $("mute").textContent = muted ? "sound off" : "sound on"; });
  let capUntil = 0;
  function showCaption(text, secs) { $("caption").textContent = text; $("caption").classList.add("on"); capUntil = clock + secs; }

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; baseFov = w < h ? 64 : 50; camera.fov = baseFov; camera.updateProjectionMatrix(); fitVideo(); }
  addEventListener("resize", resize); video.addEventListener("loadedmetadata", resize); resize();

  const clk = new T.Clock(), tmp = new T.Vector3(), fwd = new T.Vector3(); let wasHolding = false;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(0.05, clk.getDelta()); clock += dt;
    // look direction
    if (haveOrient && orient) { orientTarget(); camera.quaternion.slerp(target, 0.35 / Math.sqrt(zoom)); }
    else camera.quaternion.setFromEuler(new T.Euler(dragPitch, dragYaw, 0, "YXZ"));
    // line the lab up with where you're pointing, once the motion reading has settled (or after 1.5 s with no motion sensor)
    const settled = haveOrient && performance.now() / 1000 - firstOrientAt > 0.4;
    if (running && (!facedLab || (settled && !facedWithOrient)) && (settled || (!haveOrient && clock - t0 > 1.5))) faceLab();

    applyZoom(dt);
    const holding = exploring && lab.holding();
    if (holding !== wasHolding) { wasHolding = holding; $("putback").style.display = $("reticle").style.display = holding ? "block" : "none"; }
    const lt = running ? clock - t0 : 0;
    const hit = at => running && !fired[at] && lt >= at && (fired[at] = true);
    if (hit(TL.power)) lab.setPower(true);
    if (hit(TL.flat)) lab.setFlat(true);
    if (hit(TL.ghost)) lab.summonGhost(lab._t || lt);
    if (hit(TL.boom)) { lab.explode(lab._t || lt); play("boom"); flash = 1; bgMat.uniforms.flashCol.value.setRGB(0.6, 1.0, 0.5); }
    if (hit(TL.uv)) { lab.setUV(true); play("click"); }
    if (hit(TL.outro)) { $("outro").classList.remove("hidden"); lab.setFlat(null); if (flatOsc) { flatOsc.stop(); flatOsc = null; } }

    if (exploring && (lab._t || 0) - lastGhost > 30) { lastGhost = lab._t; lab.summonGhost(lab._t); }
    const eCycle = exploring ? (clock - exploreStart) % 45 : -1;
    if (exploring && eCycle < prevECycle) lurk = { done: false, lunging: -1 };
    prevECycle = eCycle;
    const lurkAge = exploring ? eCycle - 10 : lt - TL.lurkFrom;
    // the thing behind you: stands still until you look at it, then lunges
    const L = lab.lurker;
    if (L) {
      const active = !lurk.done && (exploring ? (eCycle >= 10 && eCycle < 40) : (running && lt >= TL.lurkFrom && lt < TL.lurkUntil));
      if (active && lurk.lunging < 0) {
        L.visible = true; L.position.set(0.3, 0, 2.3); L.rotation.y = Math.PI;       // ~2 m behind where you first faced
        const a = Math.min(1, lurkAge / 2); L.userData.body.opacity = 0.85 * a; L.userData.eyes.opacity = a;
        L.getWorldPosition(tmp); tmp.y += 1.2; fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
        const look = fwd.dot(tmp.sub(camera.position).normalize());
        if (look > 0.85 && a > 0.5) { lurk.lunging = clock; play("shriek"); flash = 0.9; bgMat.uniforms.flashCol.value.setRGB(1.0, 0.15, 0.1); }
      }
      if (lurk.lunging >= 0) {
        const u = (clock - lurk.lunging) / 0.4;
        L.getWorldPosition(tmp); const toCam = camera.position.clone().sub(tmp); toCam.y = 0;
        if (u < 1) { const step = toCam.multiplyScalar(Math.min(1, dt * 7)); root.worldToLocal(tmp.add(step)); L.position.copy(tmp); }
        else { L.visible = false; lurk.done = true; lurk.lunging = -1; }
      } else if (!active) L.visible = false;
    }

    // captions
    const cap = running ? CAPTIONS.find(([a, b]) => lt >= a && lt < b) : null;
    if (cap && clock >= capUntil) { $("caption").textContent = cap[2]; $("caption").classList.add("on"); }
    else if (!cap && clock >= capUntil) $("caption").classList.remove("on");

    // background grading: dim before power, flicker with the tube, violet under UV, flashes
    const powered = exploring || (running && lt >= TL.power);
    let dark = powered ? 0.82 : 0.3;
    if (powered && !exploring && lt < TL.power + 1.3) dark = Math.random() < 0.45 ? 0.15 : 0.82;
    if (clock < flickerUntil) dark = Math.random() < 0.45 ? 0.12 : dark;
    if (running && !exploring && lt >= TL.outro) dark *= Math.max(0.15, 1 - (lt - TL.outro));
    bgMat.uniforms.dark.value = dark;
    const uvTarget = exploring ? (uvOn ? 1 : 0) : ((running && lt >= TL.uv) ? 1 : 0);
    bgMat.uniforms.uv.value += (uvTarget - bgMat.uniforms.uv.value) * Math.min(1, dt * 4);
    flash = Math.max(0, flash - dt * 1.6); bgMat.uniforms.flash.value = flash;

    lab._t = (lab._t || 0) + dt; lab.update(lab._t, dt, camera);
    renderer.clear(); renderer.render(bgScene, bgCam); renderer.render(scene, camera);
    if (DEBUG) { $("dbg").style.display = "block"; $("dbg").textContent = `t ${lt.toFixed(1)}  orient ${haveOrient}  cam ${bgMat.uniforms.has.value}  eye ${EYE}`; }
  });
})();
</script>
</body>
</html>
